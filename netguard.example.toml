# Copy to ~/.config/netguard/netguard.toml and adjust. Every key is optional.

[network]
# iface = "wlan0"            # default: the interface with the default route
# cidr = "192.168.1.0/24"    # default: that interface's subnet

[storage]
# db_path = "~/.local/share/netguard/netguard.db"
# oui_path = "~/.local/share/netguard/manuf"   # vendor list, see `netguard oui update`

[scan]
# timeout = 2.0              # seconds to wait for ARP replies

[monitor]
# interval = 300             # seconds between scans in `netguard monitor`
# away_after = 900           # seconds unseen before a device counts as "left"

[alerts]
# log_path = "~/.local/share/netguard/events.jsonl"   # JSON lines; "" turns it off
# dedup_window = 3600        # drop a repeated alert within this many seconds
# command = ["notify-send", "NetGuard"]   # run for each alert, message added last

[arp]
# window = 60                # seconds, for the two checks below
# many_ips = 3               # alert when one MAC claims this many IPs in the window
# flood_replies = 15         # alert on this many unsolicited ARP replies in the window

[portscan]
# window = 60                # seconds
# ports = 15                 # alert when one source hits this many ports on one host
# hosts = 10                 # alert when one source hits one port on this many hosts
# allow = ["192.168.1.5"]    # e.g. your own vulnerability scanner; this machine is always allowed
