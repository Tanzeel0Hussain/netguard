name: Release

# Push a tag like v0.1.0 to publish a GitHub release with the wheel and the
# source archive attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build -e ".[dev]"
      - run: pytest -q
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import netguard; print(netguard.__version__)")
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME but version $version"; exit 1; }
      - run: python -m build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "NetGuard ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
